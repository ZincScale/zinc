name: beam-zinc

on:
  push:
    branches: [master]
    paths:
      - 'beam-transpiler/**'
      - '.github/workflows/beam-zinc.yml'
  pull_request:
    branches: [master]
    paths:
      - 'beam-transpiler/**'
      - '.github/workflows/beam-zinc.yml'

defaults:
  run:
    working-directory: beam-transpiler

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'

      - name: Check Docker
        run: docker version

      - name: Canonical Zinc e2e
        run: ./e2e-zinc.sh

      - name: zc CLI workflow
        run: REBAR3="$(command -v rebar3)" JAVA_DIR="$JAVA_HOME" ./zc/test.sh

      - name: rebar_zinc plugin
        run: REBAR3="$(command -v rebar3)" JAVA_DIR="$JAVA_HOME" ./rebar_zinc/test.sh

      - name: Package and offline install smoke
        run: ./package-test.sh
